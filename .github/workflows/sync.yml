# Refresh openapi.json / openapi.yaml from the live production document.
# Commits land as edgaze-openapi[bot] via the GitHub App installation token.
name: Sync from production

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-from-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync OpenAPI from production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint edgaze-openapi[bot] token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: "4704525"
          private-key: ${{ secrets.EDGAZE_OPENAPI_APP_PRIVATE_KEY }}
          owner: edgaze-ai
          repositories: edgaze-openapi

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install js-yaml
        run: npm install --no-save js-yaml@4.3.1

      - name: Pull production document
        run: node scripts/sync-from-production.mjs

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "edgaze-openapi[bot]"
          git config user.email "320665979+edgaze-openapi[bot]@users.noreply.github.com"
          git add openapi.json openapi.yaml
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git commit -m "Sync OpenAPI 3.1 from production"
          git push origin HEAD:main
