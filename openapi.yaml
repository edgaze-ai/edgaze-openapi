    post:
      operationId: createRun
      summary: Create run
      description: Start an asynchronous workflow run. Returns 202 with URLs to poll status, read events, and stream progress.
      tags:
        - Runs
      security:
        - bearerAuth: []
      x-required-scopes:
        - run:execute
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Optional idempotency key (max 255 chars). Prefer the header over `body.idempotencyKey`; when both are set
            they must match, or the request is rejected with 400 `invalid_request`. Values are case-sensitive and scoped
            to the Edgaze account. The fingerprint covers workflow, normalized inputs, and requested version. An exact
            replay returns the original run; a different request returns 409 `idempotency_conflict`. Keys have no
            time-based expiry while the run record exists.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "202":
          description: Run accepted.
          headers:
            Cache-Control:
              description: Always `private, no-store` on authenticated endpoints to prevent shared caching.
              schema:
                type: string
            Vary:
              description: Always includes `Authorization` on authenticated endpoints.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
        "400":
          description: >-
            Request rejected before the run started. `invalid_json`: the body was not parseable JSON.
            `missing_workflow`: no `workflow` id was supplied. `invalid_inputs`: one or more inputs were rejected —
            `error.details` lists the offending `input` keys. `invalid_request`: the `Idempotency-Key` header conflicted
            with `body.idempotencyKey`.
          headers:
            Cache-Control:
              description: Always `private, no-store` on authenticated endpoints to prevent shared caching.
              schema:
                type: string
            Vary:
              description: Always includes `Authorization` on authenticated endpoints.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalid_inputs:
                  value:
                    error:
                      code: invalid_inputs
                      message: One or more inputs were rejected.
                      details:
                        - input: topic
                          message: is required
                missing_workflow:
                  value:
                    error:
                      code: missing_workflow
                      message: Provide a `workflow` id to run.
                invalid_json:
                  value:
                    error:
                      code: invalid_json
                      message: Request body must be valid JSON.
        "401":
          description: Invalid or missing API key.
          headers:
            Cache-Control:
