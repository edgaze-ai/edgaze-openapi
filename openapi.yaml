        sequences. Each SSE `data:` frame is a `RunEvent` — the `event:` name is the event type (or `run.status` for
        lifecycle transitions) and `id:` is the `sequence`. Node output arrives as `node.output.delta` frames whose
        `data.text` you append in order, so this is the endpoint to build a live progress UI on rather than polling.
