          headers:
            Cache-Control:
              description: Always `private, no-store` on authenticated endpoints to prevent shared caching.
              schema:
                type: string
            Vary:
              description: Always includes `Authorization` on authenticated endpoints.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    error:
                      code: unauthorized
                      message: Invalid or missing API key.
        "403":
          description: >-
            Rejected for one of two reasons that need different client handling. `insufficient_scope`: the key lacks
            `workflow:write` — mint a key with that scope. `forbidden`: the key is valid and scoped, but the caller has
            no purchase to re-pin (including owner keys, which have no purchase) — there is nothing to retry. Branch on
            `error.code`.
          headers:
            Cache-Control:
              description: Always `private, no-store` on authenticated endpoints to prevent shared caching.
              schema:
                type: string
            Vary:
              description: Always includes `Authorization` on authenticated endpoints.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                missing_scope:
                  value:
                    error:
                      code: insufficient_scope
                      message: "This API key is missing the required scope: workflow:write."
                no_purchase:
                  value:
                    error:
                      code: forbidden
                      message: You do not have access to this workflow.
        "409":
          description: Workflow has no active version to accept.
          headers:
            Cache-Control:
              description: Always `private, no-store` on authenticated endpoints to prevent shared caching.
              schema:
                type: string
            Vary:
              description: Always includes `Authorization` on authenticated endpoints.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    error:
                      code: invalid_request
                      message: Workflow has no active version to accept.
        "500":
          description: Unexpected server error.
          headers:
            Cache-Control:
              description: Always `private, no-store` on authenticated endpoints to prevent shared caching.
              schema:
                type: string
            Vary:
