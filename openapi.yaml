webhooks:
  run.completed:
    post:
      summary: Run reached the completed state.
      description: >-
        Sent once a run settles successfully, after billing has committed, so `displayedChargeUsd` on the run is final.
        Delivery is a single best-effort attempt per endpoint with a 5 second timeout. There is no retry queue and no
        replay: a non-2xx, a timeout, or a redirect means the notification is lost, so treat webhooks as an optimization
        and reconcile anything critical with GET /runs. Endpoints are delivered in parallel and ordering is not
        guaranteed. Return 2xx as soon as you have persisted the payload, and do the real work asynchronously.
      parameters:
        - name: edgaze-signature
          in: header
          required: true
          description: >-
            Signature of this delivery, formatted `t=<unix seconds>,v1=<hex hmac>`. Signed with HMAC-SHA256 over the
            exact string `{t}.{raw request body}`, using your endpoint secret. Compare in constant time against the raw
            bytes you received, before JSON parsing: re-serializing the body changes the signature. Reject any delivery
            whose `t` is more than 300 seconds from your clock, otherwise a captured payload can be replayed
            indefinitely.
          schema:
            type: string
            examples:
              - t=1800000000,v1=5257a869e7…
        - name: edgaze-webhook-id
          in: header
          required: true
          description: >-
            UUID of the endpoint that this delivery was sent to. Use it to select the right secret when one receiver
            serves several endpoints.
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRunEventPayload"
        description: >-
          Signed with HMAC-SHA256 over the exact string `{t}.{raw request body}`, using your endpoint secret. Compare in
          constant time against the raw bytes you received, before JSON parsing: re-serializing the body changes the
          signature. Reject any delivery whose `t` is more than 300 seconds from your clock, otherwise a captured
          payload can be replayed indefinitely.
      responses:
        "200":
          description: >-
            Acknowledge receipt. Any 2xx counts as delivered; anything else is recorded as a failed delivery and is not
            retried.
